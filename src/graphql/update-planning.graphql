mutation UpdatePlanning($planningData: PlanningInput!, $planningId: Float!) {
  updatePlanning(planningData: $planningData, planningId: $planningId) {
    id
    amount
    currency
    date
    description
    categoryId
    repeat
    type
    year
    monthIndex
    repeatedPlanningId
    parentPlanningId
    transactions {
      id
      amount
      currency
      exchangeRate {
        rates
      }
    }
  }
}
