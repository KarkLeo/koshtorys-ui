query Planning($monthIndex: Float!, $year: Float!) {
  planning (monthIndex: $monthIndex, year: $year) {
    id
    amount
    currency
    date
    description
    categoryId
    repeat
    type
    year
    monthIndex
    repeatedPlanningId
    parentPlanningId
    transactions {
      id
      amount
      currency
      exchangeRate {
         rates
      }
    }
  }
}
