query Planning($monthIndex: Float!, $year: Float!, $exchangeDate: DateTime!) {
  planning (monthIndex: $monthIndex, year: $year) {
    id
    amount
    currency
    date
    description
    categoryId
    repeat
    type
    year
    monthIndex
    repeatedPlanningId
    parentPlanningId
    transactions {
      id
    }
  }
  exchangeRate(date: $exchangeDate) {
    id
    base
    date
    rates
  }
  repeatingPlanning(monthIndex: $monthIndex, year: $year) {
    id
    amount
    currency
    date
    description
    categoryId
    repeat
    type
    year
    monthIndex
    repeatedPlanningId
    parentPlanningId
  }
}
