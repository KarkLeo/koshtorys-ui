query Planning($monthIndex: Float!, $year: Float!, $exchangeDate: DateTime!) {
  planning (monthIndex: $monthIndex, year: $year) {
    id
    amount
    currency
    date
    description
    categoryId
    repeat
    transactionId
    type
    year
    monthIndex
  }
  exchangeRate(date: $exchangeDate) {
    id
    base
    date
    rates
  }
}
