mutation SettingsStatistics ($currency: String, $monthStartDay: Float, $monthlyBudget: Float,) {
    updateProfile(updateProfileData: {
        currency: $currency
        monthStartDay: $monthStartDay
        monthlyBudget: $monthlyBudget
    }) {
        id
        name
        email
        lang
        currency
        onboardingAt
        monthlyBudget
        monthStartDay
    }
}
